name: Merge device-sync into main

# Phase 4 of the GitHub-backed auto-sync plan — see CLAUDE.md's "GitHub-backed auto-sync"
# section. Deliberately workflow_dispatch-only for now, no `schedule:` trigger: the plan's
# own Phase 4 critique gate requires the first live run to be a manual dispatch with the
# resulting `main` diff reviewed by hand before a cron is ever enabled. Add a `schedule:`
# trigger here once that review has happened — not before.
#
# GitHub disables scheduled workflows after 60 days of repo inactivity once a schedule
# trigger does exist; workflow_dispatch (already the only trigger here) is the escape hatch
# either way, so nothing else needs to change when that trigger is added later.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # needed to dispatch deploy.yml explicitly, see the last step below

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch device-sync branch
        id: fetch_branch
        run: |
          if git fetch origin device-sync; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "device-sync branch does not exist yet — nothing to merge"
          fi

      - name: Extract sync/state.json from device-sync
        id: snapshot
        if: steps.fetch_branch.outputs.exists == 'true'
        run: |
          if git show origin/device-sync:sync/state.json > /tmp/snapshot.json 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "device-sync exists but has no sync/state.json yet — nothing to merge"
          fi

      - name: Set up Node
        if: steps.snapshot.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run merge (refuses and exits non-zero on a malformed/mismatched snapshot)
        if: steps.snapshot.outputs.found == 'true'
        run: node scripts/merge-device-sync.mjs /tmp/snapshot.json

      - name: Commit and push if changed
        if: steps.snapshot.outputs.found == 'true'
        id: commit
        run: |
          if git diff --quiet -- public/data/feedback.json; then
            echo "no changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "matracet-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data/feedback.json
            git commit -m "sync: merge device-sync state into feedback.json"
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
