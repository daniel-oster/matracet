name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets merge-device-sync.yml trigger a deploy explicitly after it commits to main — a
  # push authenticated with the default GITHUB_TOKEN (as that workflow's commit is) does
  # NOT fire other workflows' `on: push` triggers, by GitHub's design (loop prevention), so
  # relying on the trigger above alone would silently never deploy a device-sync merge. See
  # CLAUDE.md's "GitHub-backed auto-sync" section, Phase 4.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      # actions/deploy-pages occasionally returns a hard "Deployment failed, try
      # again later" from GitHub's Pages API — a transient backend hiccup, not a
      # build problem. error_count/reporting_interval only govern polling errors
      # once a deployment is in progress, not this initial failure, so retry the
      # whole step a couple of times with a short backoff before giving up.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
