name: Testnotis

# Sends a "Testnotis" to every phone in push-subscriptions.json. Runs when that file
# changes (i.e. right after a new phone is connected) and on manual dispatch.
on:
  push:
    branches: [main]
    paths: [push-subscriptions.json]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skicka testnotis
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          node scripts/send-push.mjs --test
